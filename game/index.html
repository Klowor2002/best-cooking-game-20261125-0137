<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dapur Kilat — Warung Kitchen Game</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #2b1d16;
    font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  #wrap {
    width: min(1280px, 100vw);
    aspect-ratio: 1280 / 800;
    position: relative;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.6);
  }
  canvas {
    display: block; width: 100%; height: 100%;
    background: #f6e7c8;
    cursor: pointer;
    image-rendering: auto;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="800"></canvas>
</div>
<script src="src/config.js"></script>
<script src="src/random.js"></script>
<script src="src/recipes.js"></script>
<script src="src/audio.js"></script>
<script src="src/orders.js"></script>
<script src="src/world.js"></script>
<script src="src/input.js"></script>
<script src="src/render.js"></script>
<script src="src/shots.js"></script>
<script src="src/main.js"></script>
</body>
</html>
